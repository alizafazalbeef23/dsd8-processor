<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 580" width="1020" height="580" style="background:#090d16; font-family:'Consolas','Courier New',monospace;">
  <defs>
    <filter id="waveShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="15" width="980" height="45" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="510" y="42" fill="#f8fafc" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Watchdog Timer Waveform Timing Diagram (RELOAD = 3, PRESCALE = 1)
  </text>

  <!-- Grid Background -->
  <!-- Signal Labels Column: X = 30 to 180. Waveforms: X = 190 to 970 (12 cycles, 65px per cycle) -->
  <!-- Vertical cycle grid lines -->
  <!-- Cycle numbers: 0 to 11 -->
  <!-- X positions: C0=190, C1=255, C2=320, C3=385, C4=450, C5=515, C6=580, C7=645, C8=710, C9=775, C10=840, C11=905, C12=970 -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="2,3">
    <line x1="190" y1="75" x2="190" y2="530"/>
    <line x1="255" y1="75" x2="255" y2="530"/>
    <line x1="320" y1="75" x2="320" y2="530"/>
    <line x1="385" y1="75" x2="385" y2="530"/>
    <line x1="450" y1="75" x2="450" y2="530"/>
    <line x1="515" y1="75" x2="515" y2="530"/>
    <line x1="580" y1="75" x2="580" y2="530"/>
    <line x1="645" y1="75" x2="645" y2="530"/>
    <line x1="710" y1="75" x2="710" y2="530"/>
    <line x1="775" y1="75" x2="775" y2="530"/>
    <line x1="840" y1="75" x2="840" y2="530"/>
    <line x1="905" y1="75" x2="905" y2="530"/>
    <line x1="970" y1="75" x2="970" y2="530"/>
  </g>

  <!-- Cycle Header Labels -->
  <g fill="#94a3b8" font-size="12" text-anchor="middle">
    <text x="222" y="85">Cycle 0</text>
    <text x="287" y="85">Cycle 1</text>
    <text x="352" y="85">Cycle 2</text>
    <text x="417" y="85">Cycle 3</text>
    <text x="482" y="85">Cycle 4</text>
    <text x="547" y="85">Cycle 5</text>
    <text x="612" y="85">Cycle 6</text>
    <text x="677" y="85">Cycle 7</text>
    <text x="742" y="85">Cycle 8</text>
    <text x="807" y="85">Cycle 9</text>
    <text x="872" y="85">Cycle 10</text>
    <text x="937" y="85">Cycle 11</text>
  </g>

  <!-- ================= SIGNAL 1: clk ================= -->
  <text x="40" y="125" fill="#38bdf8" font-size="13" font-weight="bold">clk</text>
  <!-- 12 square waves -->
  <path d="M 190 135 L 222 135 L 222 105 L 255 105 L 255 135
           L 287 135 L 287 105 L 320 105 L 320 135
           L 352 135 L 352 105 L 385 105 L 385 135
           L 417 135 L 417 105 L 450 105 L 450 135
           L 482 135 L 482 105 L 515 105 L 515 135
           L 547 135 L 547 105 L 580 105 L 580 135
           L 612 135 L 612 105 L 645 105 L 645 135
           L 677 135 L 677 105 L 710 105 L 710 135
           L 742 135 L 742 105 L 775 105 L 775 135
           L 807 135 L 807 105 L 840 105 L 840 135
           L 872 135 L 872 105 L 905 105 L 905 135
           L 937 135 L 937 105 L 970 105"
        fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- ================= SIGNAL 2: presc_cnt ================= -->
  <text x="40" y="185" fill="#22d3ee" font-size="13" font-weight="bold">presc_count</text>
  <!-- Bus segments for prescaler: alternates 1, 0, 1, 0... -->
  <!-- C0: 1, C1: 0, C2: 1, C3: 0, C4: 1, C5: 0, C6: 1, C7: 0, C8: 1... -->
  <g fill="#0e7490" stroke="#06b6d4" stroke-width="1.5">
    <polygon points="190,180 195,165 250,165 255,180 250,195 195,195"/>
    <polygon points="255,180 260,165 315,165 320,180 315,195 260,195"/>
    <polygon points="320,180 325,165 380,165 385,180 380,195 325,195"/>
    <polygon points="385,180 390,165 445,165 450,180 445,195 390,195"/>
    <polygon points="450,180 455,165 510,165 515,180 510,195 455,195"/>
    <polygon points="515,180 520,165 575,165 580,180 575,195 520,195"/>
    <polygon points="580,180 585,165 640,165 645,180 640,195 585,195"/>
    <polygon points="645,180 650,165 705,165 710,180 705,195 650,195"/>
    <polygon points="710,180 715,165 770,165 775,180 770,195 715,195"/>
    <polygon points="775,180 780,165 835,165 840,180 835,195 780,195"/>
    <polygon points="840,180 845,165 900,165 905,180 900,195 845,195"/>
    <polygon points="905,180 910,165 965,165 970,180 965,195 910,195"/>
  </g>
  <g fill="#cffafe" font-size="12" text-anchor="middle">
    <text x="222" y="185">1</text><text x="287" y="185">0</text>
    <text x="352" y="185">1</text><text x="417" y="185">0</text>
    <text x="482" y="185">1</text><text x="547" y="185">0</text>
    <text x="612" y="185">1</text><text x="677" y="185">0</text>
    <text x="742" y="185">1</text><text x="807" y="185">0</text>
    <text x="872" y="185">1</text><text x="937" y="185">0</text>
  </g>

  <!-- ================= SIGNAL 3: presc_tick ================= -->
  <text x="40" y="245" fill="#34d399" font-size="13" font-weight="bold">presc_tick</text>
  <!-- Pulses whenever presc_count == 0 (at cycles 1, 3, 5, 7, 9, 11) -->
  <path d="M 190 255 L 255 255 L 255 230 L 320 230 L 320 255
           L 385 255 L 385 230 L 450 230 L 450 255
           L 515 255 L 515 230 L 580 230 L 580 255
           L 645 255 L 645 230 L 710 230 L 710 255
           L 775 255 L 775 230 L 840 230 L 840 255
           L 905 255 L 905 230 L 970 230"
        fill="none" stroke="#34d399" stroke-width="2"/>

  <!-- ================= SIGNAL 4: down_count ================= -->
  <text x="40" y="315" fill="#c084fc" font-size="13" font-weight="bold">down_count</text>
  <!-- Bus: 3 for 2 cycles, 2 for 2 cycles, 1 for 2 cycles, 0 for 2 cycles, then reloads to 3 -->
  <g fill="#4c1d95" stroke="#a855f7" stroke-width="1.5">
    <polygon points="190,310 195,295 315,295 320,310 315,325 195,325"/>
    <polygon points="320,310 325,295 445,295 450,310 445,325 325,325"/>
    <polygon points="450,310 455,295 575,295 580,310 575,325 455,325"/>
    <polygon points="580,310 585,295 705,295 710,310 705,325 585,325"/>
    <polygon points="710,310 715,295 835,295 840,310 835,325 715,325"/>
    <polygon points="840,310 845,295 965,295 970,310 965,325 845,325"/>
  </g>
  <g fill="#f3e8ff" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="255" y="315">3</text>
    <text x="385" y="315">2</text>
    <text x="515" y="315">1</text>
    <text x="645" y="315">0 (Timeout imminent)</text>
    <text x="775" y="315">3 (Reloaded)</text>
    <text x="905" y="315">2</text>
  </g>

  <!-- ================= SIGNAL 5: valid_kick ================= -->
  <text x="40" y="375" fill="#fbbf24" font-size="13" font-weight="bold">valid_kick (0xA5)</text>
  <!-- No kick in cycles 0-8 (causes timeout). Kick sent in Cycle 10! -->
  <path d="M 190 385 L 840 385 L 840 355 L 905 355 L 905 385 L 970 385"
        fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="872" y="350" fill="#fde68a" font-size="10" text-anchor="middle">Kick Serviced!</text>

  <!-- ================= SIGNAL 6: expired (Sticky) ================= -->
  <text x="40" y="440" fill="#f87171" font-size="13" font-weight="bold">expired (0x54[0])</text>
  <!-- LOW from C0 to C8 (exactly 8 cycles = (3+1)*(1+1)). Becomes HIGH at C8 and stays HIGH! -->
  <path d="M 190 450 L 710 450 L 710 420 L 970 420"
        fill="none" stroke="#f87171" stroke-width="2.5"/>
  <rect x="715" y="405" width="130" height="18" rx="3" fill="#7f1d1d"/>
  <text x="780" y="418" fill="#fecaca" font-size="10" font-weight="bold" text-anchor="middle">EXPIRED (Sticky HIGH)</text>

  <!-- ================= SIGNAL 7: LED 7 Output ================= -->
  <text x="40" y="505" fill="#ef4444" font-size="13" font-weight="bold">LED 7 Output</text>
  <path d="M 190 515 L 710 515 L 710 485 L 970 485"
        fill="none" stroke="#ef4444" stroke-width="3"/>
  <text x="450" y="510" fill="#64748b" font-size="11" text-anchor="middle">LED 7 = OFF (0)</text>
  <text x="840" y="480" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">LED 7 = ON (1) ALARM ACTIVE</text>

  <!-- TIMEOUT BRACKET / ANNOTATION -->
  <line x1="190" y1="545" x2="710" y2="545" stroke="#a855f7" stroke-width="2"/>
  <line x1="190" y1="540" x2="190" y2="550" stroke="#a855f7" stroke-width="2"/>
  <line x1="710" y1="540" x2="710" y2="550" stroke="#a855f7" stroke-width="2"/>
  <text x="450" y="565" fill="#e9d5ff" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
    Exact Timeout Period = (RELOAD + 1) × (PRESCALE + 1) = (3 + 1) × (1 + 1) = 8 Clock Cycles
  </text>
</svg>
