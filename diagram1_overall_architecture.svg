<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background:#0f172a; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wdtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="ledGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="940" height="50" rx="8" fill="#1e293b" stroke="#334155" filter="url(#shadow)"/>
  <text x="500" y="52" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    DSD-8 Microprocessor - Overall Architecture with Integrated Watchdog Timer
  </text>

  <!-- TOP-LEVEL BOUNDARY: dsd8_top -->
  <rect x="30" y="85" width="940" height="540" rx="12" fill="#090d16" stroke="#334155" stroke-dasharray="6,4" filter="url(#shadow)"/>
  <text x="50" y="115" fill="#94a3b8" font-size="14" font-weight="bold">TOP MODULE: dsd8_top.v</text>

  <!-- DSD-8 CPU Box -->
  <rect x="60" y="150" width="220" height="380" rx="10" fill="url(#cpuGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="150" width="220" height="40" rx="10" fill="#0284c7"/>
  <text x="170" y="176" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">dsd8_cpu.v</text>

  <!-- CPU Sub-components -->
  <rect x="80" y="210" width="180" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="170" y="238" fill="#e2e8f0" font-size="13" text-anchor="middle">Register File (R0-R7)</text>

  <rect x="80" y="270" width="180" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="170" y="298" fill="#e2e8f0" font-size="13" text-anchor="middle">ALU &amp; Flags (Z,N,C,V)</text>

  <rect x="80" y="330" width="180" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="170" y="358" fill="#e2e8f0" font-size="13" text-anchor="middle">Program Counter (9-bit)</text>

  <rect x="80" y="390" width="180" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="170" y="418" fill="#e2e8f0" font-size="13" text-anchor="middle">Control Unit &amp; Decoder</text>

  <rect x="80" y="455" width="180" height="55" rx="6" fill="#0f172a" stroke="#0284c7"/>
  <text x="170" y="478" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">IO Interface</text>
  <text x="170" y="498" fill="#94a3b8" font-size="11" text-anchor="middle">io_port, wdata, rdata, rd, wr</text>

  <!-- IO BUS Box -->
  <rect x="330" y="150" width="190" height="380" rx="10" fill="url(#cpuGrad)" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="330" y="150" width="190" height="40" rx="10" fill="#4f46e5"/>
  <text x="425" y="176" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">io_bus.v</text>

  <text x="425" y="215" fill="#a5b4fc" font-size="12" font-weight="bold" text-anchor="middle">Address Decoder</text>

  <rect x="345" y="235" width="160" height="35" rx="4" fill="#1e293b" stroke="#4338ca"/>
  <text x="425" y="258" fill="#c7d2fe" font-size="11" text-anchor="middle">0x00-0x02: SW / BTN / LED</text>

  <rect x="345" y="280" width="160" height="35" rx="4" fill="#1e293b" stroke="#4338ca"/>
  <text x="425" y="303" fill="#c7d2fe" font-size="11" text-anchor="middle">0x10-0x11: 7-Segment</text>

  <rect x="345" y="325" width="160" height="35" rx="4" fill="#1e293b" stroke="#4338ca"/>
  <text x="425" y="348" fill="#c7d2fe" font-size="11" text-anchor="middle">0x20-0x40: Ref Peripherals</text>

  <rect x="345" y="375" width="160" height="50" rx="4" fill="#312e81" stroke="#6366f1" stroke-width="2"/>
  <text x="425" y="398" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">0x50-0x55: WATCHDOG</text>
  <text x="425" y="415" fill="#a5b4fc" font-size="10" text-anchor="middle">Dedicated IO Address Space</text>

  <!-- Bus Connection CPU <-> IO_BUS -->
  <line x1="280" y1="475" x2="330" y2="475" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="330" y1="490" x2="280" y2="490" stroke="#818cf8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="305" y="465" fill="#38bdf8" font-size="10" text-anchor="middle">IO Req</text>

  <!-- WATCHDOG TIMER Box -->
  <rect x="570" y="150" width="250" height="380" rx="10" fill="url(#wdtGrad)" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="570" y="150" width="250" height="40" rx="10" fill="#9333ea"/>
  <text x="695" y="176" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">watchdog_timer.v</text>

  <!-- Internal Watchdog Sub-Blocks -->
  <rect x="590" y="205" width="210" height="32" rx="4" fill="#2e1065" stroke="#a855f7"/>
  <text x="695" y="226" fill="#f3e8ff" font-size="12" text-anchor="middle">Control Reg [0x50: WD_CTRL]</text>

  <rect x="590" y="245" width="210" height="32" rx="4" fill="#2e1065" stroke="#a855f7"/>
  <text x="695" y="266" fill="#f3e8ff" font-size="12" text-anchor="middle">Reload Reg [0x51: WD_RELOAD]</text>

  <rect x="590" y="285" width="210" height="32" rx="4" fill="#2e1065" stroke="#a855f7"/>
  <text x="695" y="306" fill="#f3e8ff" font-size="12" text-anchor="middle">Prescaler Reg [0x52: WD_PRESC]</text>

  <rect x="590" y="325" width="210" height="32" rx="4" fill="#2e1065" stroke="#a855f7"/>
  <text x="695" y="346" fill="#f3e8ff" font-size="12" text-anchor="middle">Down Counter [0x55: WD_COUNT]</text>

  <rect x="590" y="365" width="210" height="32" rx="4" fill="#2e1065" stroke="#a855f7"/>
  <text x="695" y="386" fill="#f3e8ff" font-size="12" text-anchor="middle">Kick Detector [0x53: Key 0xA5]</text>

  <rect x="590" y="405" width="210" height="32" rx="4" fill="#581c87" stroke="#c084fc"/>
  <text x="695" y="426" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Sticky Expired Flag [0x54]</text>

  <rect x="590" y="445" width="210" height="32" rx="4" fill="#2e1065" stroke="#a855f7"/>
  <text x="695" y="466" fill="#f3e8ff" font-size="12" text-anchor="middle">Reset Request Gen [Bit 1 en]</text>

  <!-- Bus Connection IO_BUS <-> WATCHDOG -->
  <line x1="505" y1="400" x2="570" y2="400" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="537" y="392" fill="#c084fc" font-size="11" text-anchor="middle">IO Bus</text>

  <!-- OUTPUT: LED 7 -->
  <rect x="860" y="395" width="90" height="60" rx="8" fill="url(#ledGrad)" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)"/>
  <text x="905" y="420" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">LED 7</text>
  <text x="905" y="440" fill="#fecaca" font-size="10" text-anchor="middle">(WDT Alarm)</text>

  <!-- Line WDT -> LED 7 -->
  <path d="M 800 421 L 860 421" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="830" y="413" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle">expired</text>

  <!-- FEEDBACK: reset_req -> CPU rst_n -->
  <path d="M 800 465 L 830 465 L 830 560 L 170 560 L 170 530" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
  <rect x="420" y="548" width="160" height="24" rx="4" fill="#451a03" stroke="#f59e0b"/>
  <text x="500" y="564" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">wd_reset_req (Active-High)</text>

  <text x="170" y="590" fill="#94a3b8" font-size="11" text-anchor="middle">cpu_rst_n = rst_n &amp; (~wd_reset_req)</text>
</svg>
