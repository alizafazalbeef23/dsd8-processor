<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 820" width="750" height="820" style="background:#0b1120; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="25" y="15" width="700" height="45" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="375" y="44" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">
    Watchdog Timer - Execution Flowchart &amp; State Progression
  </text>

  <!-- START -->
  <rect x="275" y="80" width="200" height="40" rx="20" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#boxShadow)"/>
  <text x="375" y="105" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">START / RESET (rst_n = 0)</text>

  <line x1="375" y1="120" x2="375" y2="145" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>

  <!-- STEP 1: LOAD RELOAD & PRESC -->
  <rect x="235" y="145" width="280" height="48" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#boxShadow)"/>
  <text x="375" y="167" fill="#f1f5f9" font-size="13" font-weight="bold" text-anchor="middle">1. Configure Reload &amp; Prescaler</text>
  <text x="375" y="184" fill="#94a3b8" font-size="11" text-anchor="middle">OUT 0x51 (RELOAD) &amp; OUT 0x52 (PRESC)</text>

  <line x1="375" y1="193" x2="375" y2="218" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>

  <!-- STEP 2: ENABLE WATCHDOG -->
  <rect x="235" y="218" width="280" height="48" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#boxShadow)"/>
  <text x="375" y="240" fill="#f1f5f9" font-size="13" font-weight="bold" text-anchor="middle">2. Enable Watchdog Timer</text>
  <text x="375" y="257" fill="#94a3b8" font-size="11" text-anchor="middle">OUT 0x50 (WD_CTRL[0] = 1, [1] = reset_en)</text>

  <line x1="375" y1="266" x2="375" y2="291" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>

  <!-- STEP 3: START COUNTING -->
  <rect x="245" y="291" width="260" height="48" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#boxShadow)"/>
  <text x="375" y="313" fill="#c7d2fe" font-size="13" font-weight="bold" text-anchor="middle">3. Start Down Counter</text>
  <text x="375" y="330" fill="#a5b4fc" font-size="11" text-anchor="middle">down_count &lt;= reload, presc_cnt &lt;= presc</text>

  <line x1="375" y1="339" x2="375" y2="370" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>

  <!-- DECISION 1: VALID KICK RECEIVED? -->
  <polygon points="375,370 515,420 375,470 235,420" fill="#312e81" stroke="#a855f7" stroke-width="2" filter="url(#boxShadow)"/>
  <text x="375" y="415" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Did CPU send valid kick?</text>
  <text x="375" y="432" fill="#d8b4fe" font-size="10" text-anchor="middle">(OUT 0x53, key == 0xA5)</text>

  <!-- YES PATH: KICK RECEIVED -->
  <path d="M 235 420 L 110 420 L 110 315 L 245 315" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <rect x="135" y="395" width="80" height="24" rx="4" fill="#064e3b" stroke="#34d399"/>
  <text x="175" y="411" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle">YES (Kick)</text>
  <text x="100" y="350" fill="#34d399" font-size="10" font-weight="bold" transform="rotate(-90 100 350)">Reload Counter &amp; Continue</text>

  <!-- NO PATH: DOWN TO ZERO? -->
  <line x1="375" y1="470" x2="375" y2="510" stroke="#f87171" stroke-width="2.5" marker-end="url(#redArrow)"/>
  <rect x="385" y="475" width="70" height="22" rx="3" fill="#7f1d1d" stroke="#f87171"/>
  <text x="420" y="490" fill="#fecaca" font-size="10" font-weight="bold" text-anchor="middle">NO (Wait)</text>

  <!-- DECISION 2: COUNTER REACHES ZERO? -->
  <polygon points="375,510 515,560 375,610 235,560" fill="#4c0519" stroke="#f43f5e" stroke-width="2" filter="url(#boxShadow)"/>
  <text x="375" y="555" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Down counter reaches 0?</text>
  <text x="375" y="572" fill="#fda4af" font-size="10" text-anchor="middle">(Timeout expired?)</text>

  <!-- NO PATH FROM TIMEOUT -> CONTINUE COUNTING -->
  <path d="M 515 560 L 640 560 L 640 420 L 515 420" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrow)"/>
  <rect x="540" y="535" width="80" height="22" rx="3" fill="#1e293b" stroke="#38bdf8"/>
  <text x="580" y="550" fill="#7dd3fc" font-size="10" text-anchor="middle">NO (Count -1)</text>

  <!-- YES PATH: EXPIRED = 1 -->
  <line x1="375" y1="610" x2="375" y2="650" stroke="#f87171" stroke-width="2.5" marker-end="url(#redArrow)"/>
  <rect x="385" y="618" width="80" height="22" rx="3" fill="#7f1d1d" stroke="#f87171"/>
  <text x="425" y="633" fill="#fecaca" font-size="10" font-weight="bold" text-anchor="middle">YES (Timeout)</text>

  <!-- TIMEOUT ACTIONS -->
  <rect x="220" y="650" width="310" height="65" rx="8" fill="#881337" stroke="#fb7185" stroke-width="2" filter="url(#boxShadow)"/>
  <text x="375" y="673" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Watchdog Expired!</text>
  <text x="375" y="692" fill="#fecdd3" font-size="12" text-anchor="middle">Set Sticky Expired = 1 &amp; Turn ON LED 7</text>
  <text x="375" y="707" fill="#ffe4e6" font-size="10" text-anchor="middle">If reset_en == 1: Assert 1-cycle CPU reset pulse</text>

  <!-- RECOVERY OR HALT -->
  <line x1="375" y1="715" x2="375" y2="750" stroke="#f87171" stroke-width="2" marker-end="url(#redArrow)"/>
  <rect x="235" y="750" width="280" height="45" rx="8" fill="#1e293b" stroke="#94a3b8" filter="url(#boxShadow)"/>
  <text x="375" y="770" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">Post-Timeout State</text>
  <text x="375" y="785" fill="#94a3b8" font-size="10" text-anchor="middle">LED 7 stays ON until software writes to 0x54</text>
</svg>
