<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="950" height="550" style="background:#0b1120; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="25" y="15" width="900" height="45" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="475" y="44" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">
    Watchdog Timer - Internal Microarchitecture &amp; Signal Flow
  </text>

  <!-- CLK and RST Inputs -->
  <rect x="40" y="90" width="100" height="35" rx="6" fill="#0369a1" stroke="#38bdf8"/>
  <text x="90" y="112" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">clk (100MHz)</text>

  <rect x="40" y="140" width="100" height="35" rx="6" fill="#0f766e" stroke="#2dd4bf"/>
  <text x="90" y="162" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">rst_n (Active-L)</text>

  <!-- IO Bus Inputs -->
  <rect x="40" y="240" width="130" height="80" rx="8" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="105" y="265" fill="#c7d2fe" font-size="13" font-weight="bold" text-anchor="middle">IO Bus Interface</text>
  <text x="105" y="285" fill="#a5b4fc" font-size="10" text-anchor="middle">io_port, io_wdata</text>
  <text x="105" y="302" fill="#a5b4fc" font-size="10" text-anchor="middle">io_rd, io_wr</text>

  <!-- PRESCALER SECTION -->
  <rect x="230" y="90" width="220" height="200" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <rect x="230" y="90" width="220" height="35" rx="10" fill="#0891b2"/>
  <text x="340" y="113" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Prescaler Unit</text>

  <rect x="250" y="140" width="180" height="35" rx="4" fill="#164e63" stroke="#22d3ee"/>
  <text x="340" y="162" fill="#cffafe" font-size="11" text-anchor="middle">WD_PRESC Reg (0x52)</text>

  <rect x="250" y="195" width="180" height="40" rx="4" fill="#1e293b" stroke="#0891b2"/>
  <text x="340" y="220" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Prescaler Counter</text>
  <text x="340" y="248" fill="#67e8f9" font-size="10" text-anchor="middle">Counts down from PRESC to 0</text>

  <!-- Line CLK -> Prescaler -->
  <path d="M 140 107 L 230 107" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)"/>
  <!-- Line PRESC Reg -> Prescaler Counter -->
  <path d="M 340 175 L 340 195" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>

  <!-- PRESCALER TICK SIGNAL -->
  <path d="M 450 215 L 530 215" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrGreen)"/>
  <rect x="455" y="190" width="70" height="22" rx="3" fill="#064e3b" stroke="#10b981"/>
  <text x="490" y="205" fill="#6ee7b7" font-size="10" font-weight="bold" text-anchor="middle">presc_tick</text>

  <!-- DOWN COUNTER SECTION -->
  <rect x="530" y="90" width="230" height="280" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <rect x="530" y="90" width="230" height="35" rx="10" fill="#9333ea"/>
  <text x="645" y="113" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Down Counter &amp; Logic</text>

  <rect x="550" y="135" width="190" height="35" rx="4" fill="#3b0764" stroke="#c084fc"/>
  <text x="645" y="157" fill="#f3e8ff" font-size="11" text-anchor="middle">WD_RELOAD Reg (0x51)</text>

  <rect x="550" y="195" width="190" height="50" rx="4" fill="#1e293b" stroke="#a855f7"/>
  <text x="645" y="218" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Down Counter [7:0]</text>
  <text x="645" y="235" fill="#d8b4fe" font-size="10" text-anchor="middle">Decrements on presc_tick</text>

  <rect x="550" y="260" width="190" height="35" rx="4" fill="#2e1065" stroke="#a855f7"/>
  <text x="645" y="282" fill="#e9d5ff" font-size="11" text-anchor="middle">Timeout Detector (Zero?)</text>

  <rect x="550" y="310" width="190" height="40" rx="4" fill="#1e293b" stroke="#c084fc"/>
  <text x="645" y="328" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">WD_CTRL Reg (0x50)</text>
  <text x="645" y="343" fill="#94a3b8" font-size="9" text-anchor="middle">Bit 0: Enable | Bit 1: Reset-On-Expiry</text>

  <!-- KICK MECHANISM SECTION -->
  <rect x="230" y="360" width="220" height="150" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <rect x="230" y="360" width="220" height="35" rx="10" fill="#d97706"/>
  <text x="340" y="383" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Kick Service Logic</text>

  <rect x="250" y="410" width="180" height="35" rx="4" fill="#451a03" stroke="#fbbf24"/>
  <text x="340" y="432" fill="#fef3c7" font-size="11" text-anchor="middle">Key Match: 0xA5</text>

  <rect x="250" y="455" width="180" height="40" rx="4" fill="#1e293b" stroke="#d97706"/>
  <text x="340" y="475" fill="#fde68a" font-size="11" text-anchor="middle">Port == 0x53 &amp; io_wr</text>
  <text x="340" y="490" fill="#94a3b8" font-size="9" text-anchor="middle">Invalid keys rejected</text>

  <!-- Line IO Bus -> Kick Logic -->
  <path d="M 170 300 L 230 430" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrPurple)"/>

  <!-- Line Valid Kick -> Reloads Counter (PRIORITY KICK) -->
  <path d="M 450 435 L 500 435 L 500 220 L 530 220" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrPurple)"/>
  <rect x="460" y="320" width="90" height="24" rx="4" fill="#78350f" stroke="#f59e0b"/>
  <text x="505" y="336" fill="#fef3c7" font-size="10" font-weight="bold" text-anchor="middle">Reload Counter</text>

  <!-- OUTPUT FLAGS & ALARMS -->
  <!-- Timeout Line -->
  <path d="M 760 275 L 820 275" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#arrRed)"/>

  <!-- Sticky Expired Box -->
  <rect x="820" y="240" width="110" height="70" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="875" y="265" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">WD_STATUS</text>
  <text x="875" y="282" fill="#fecaca" font-size="11" font-weight="bold" text-anchor="middle">Expired = 1</text>
  <text x="875" y="298" fill="#fca5a5" font-size="9" text-anchor="middle">(Sticky until W1C)</text>

  <!-- LED 7 Output -->
  <path d="M 875 310 L 875 380" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrRed)"/>
  <circle cx="875" cy="410" r="22" fill="#dc2626" stroke="#fecaca" stroke-width="3" filter="url(#glow)"/>
  <text x="875" y="415" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">LED 7</text>

  <!-- Reset Request Output -->
  <path d="M 760 330 L 820 480" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrPurple)"/>
  <rect x="820" y="470" width="110" height="45" rx="6" fill="#422006" stroke="#eab308"/>
  <text x="875" y="490" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">reset_req</text>
  <text x="875" y="505" fill="#fde047" font-size="9" text-anchor="middle">1-cycle CPU Reset</text>
</svg>
