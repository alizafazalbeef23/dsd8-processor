<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" style="background:#0b1120; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="readArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="writeArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="25" y="15" width="950" height="45" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="500" y="44" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">
    DSD-8 CPU &amp; Watchdog Timer Register Interface (Addresses 0x50 - 0x55)
  </text>

  <!-- CPU SIDE (Left) -->
  <rect x="35" y="80" width="250" height="500" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="35" y="80" width="250" height="40" rx="10" fill="#0284c7"/>
  <text x="160" y="106" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">DSD-8 CPU Instructions</text>

  <!-- IN instruction block -->
  <rect x="50" y="140" width="220" height="150" rx="6" fill="#1e293b" stroke="#0ea5e9"/>
  <text x="160" y="165" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">READ INSTRUCTION: IN</text>
  <text x="160" y="185" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">IN Rd, port</text>
  <text x="65" y="210" fill="#94a3b8" font-size="11">Operation: Rd &lt;= IO[port]</text>
  <text x="65" y="228" fill="#94a3b8" font-size="11">Drives: io_port = port</text>
  <text x="65" y="246" fill="#94a3b8" font-size="11">Asserts: io_rd = 1'b1</text>
  <text x="65" y="264" fill="#94a3b8" font-size="11">Samples: io_rdata -&gt; Rd</text>

  <!-- OUT instruction block -->
  <rect x="50" y="320" width="220" height="150" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="160" y="345" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">WRITE INSTRUCTION: OUT</text>
  <text x="160" y="365" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">OUT port, Rs</text>
  <text x="65" y="390" fill="#94a3b8" font-size="11">Operation: IO[port] &lt;= Rs</text>
  <text x="65" y="408" fill="#94a3b8" font-size="11">Drives: io_port = port</text>
  <text x="65" y="426" fill="#94a3b8" font-size="11">Drives: io_wdata = Rs</text>
  <text x="65" y="444" fill="#94a3b8" font-size="11">Asserts: io_wr = 1'b1</text>

  <rect x="50" y="490" width="220" height="70" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="160" y="515" fill="#a5b4fc" font-size="12" font-weight="bold" text-anchor="middle">Handshake Protocol</text>
  <text x="160" y="535" fill="#e0e7ff" font-size="11" text-anchor="middle">io_ready = 1 (1-cycle access)</text>
  <text x="160" y="550" fill="#94a3b8" font-size="10" text-anchor="middle">Zero wait-states for Watchdog</text>

  <!-- REGISTER MAP (Right) -->
  <rect x="360" y="80" width="600" height="500" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="360" y="80" width="600" height="40" rx="10" fill="#7e22ce"/>
  <text x="660" y="106" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">Watchdog Timer Register Map (8-bit Architecture)</text>

  <!-- 0x50: WD_CTRL -->
  <g transform="translate(380, 135)">
    <rect x="0" y="0" width="560" height="60" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
    <rect x="0" y="0" width="75" height="60" rx="6" fill="#4338ca"/>
    <text x="37" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">0x50</text>
    <text x="37" y="45" fill="#c7d2fe" font-size="10" text-anchor="middle">[R/W]</text>
    <text x="90" y="25" fill="#ffffff" font-size="13" font-weight="bold">WD_CTRL (Control Register)</text>
    <text x="90" y="45" fill="#a5b4fc" font-size="11">Bit 0: Enable (1=ON, 0=OFF) | Bit 1: Reset-On-Expiry (1=Assert Reset, 0=Alarm Only)</text>
  </g>

  <!-- 0x51: WD_RELOAD -->
  <g transform="translate(380, 205)">
    <rect x="0" y="0" width="560" height="60" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
    <rect x="0" y="0" width="75" height="60" rx="6" fill="#4338ca"/>
    <text x="37" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">0x51</text>
    <text x="37" y="45" fill="#c7d2fe" font-size="10" text-anchor="middle">[R/W]</text>
    <text x="90" y="25" fill="#ffffff" font-size="13" font-weight="bold">WD_RELOAD (Reload Register)</text>
    <text x="90" y="45" fill="#a5b4fc" font-size="11">Bits [7:0]: 8-bit counter reload value loaded into counter on kick or enable</text>
  </g>

  <!-- 0x52: WD_PRESC -->
  <g transform="translate(380, 275)">
    <rect x="0" y="0" width="560" height="60" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
    <rect x="0" y="0" width="75" height="60" rx="6" fill="#4338ca"/>
    <text x="37" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">0x52</text>
    <text x="37" y="45" fill="#c7d2fe" font-size="10" text-anchor="middle">[R/W]</text>
    <text x="90" y="25" fill="#ffffff" font-size="13" font-weight="bold">WD_PRESC (Prescaler Register)</text>
    <text x="90" y="45" fill="#a5b4fc" font-size="11">Bits [7:0]: Clock prescaler reload value. Decrements down counter every (PRESC+1) clocks</text>
  </g>

  <!-- 0x53: WD_KICK -->
  <g transform="translate(380, 345)">
    <rect x="0" y="0" width="560" height="60" rx="6" fill="#451a03" stroke="#f59e0b"/>
    <rect x="0" y="0" width="75" height="60" rx="6" fill="#b45309"/>
    <text x="37" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">0x53</text>
    <text x="37" y="45" fill="#fef3c7" font-size="10" text-anchor="middle">[Write-Only]</text>
    <text x="90" y="25" fill="#ffffff" font-size="13" font-weight="bold">WD_KICK (Kick / Watchdog Service)</text>
    <text x="90" y="45" fill="#fde68a" font-size="11">Write Key 0xA5 to reload counter and postpone timeout. Wrong values ignored!</text>
  </g>

  <!-- 0x54: WD_STATUS -->
  <g transform="translate(380, 415)">
    <rect x="0" y="0" width="560" height="60" rx="6" fill="#581c87" stroke="#c084fc"/>
    <rect x="0" y="0" width="75" height="60" rx="6" fill="#7e22ce"/>
    <text x="37" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">0x54</text>
    <text x="37" y="45" fill="#f3e8ff" font-size="10" text-anchor="middle">[R/W]</text>
    <text x="90" y="25" fill="#ffffff" font-size="13" font-weight="bold">WD_STATUS (Status &amp; Flag Register)</text>
    <text x="90" y="45" fill="#e9d5ff" font-size="11">Bit 0: Sticky Expired Flag (1=Timeout) | Bit 1: Enabled | Write 0x00 to Clear</text>
  </g>

  <!-- 0x55: WD_COUNT -->
  <g transform="translate(380, 485)">
    <rect x="0" y="0" width="560" height="60" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
    <rect x="0" y="0" width="75" height="60" rx="6" fill="#4338ca"/>
    <text x="37" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">0x55</text>
    <text x="37" y="45" fill="#c7d2fe" font-size="10" text-anchor="middle">[Read-Only]</text>
    <text x="90" y="25" fill="#ffffff" font-size="13" font-weight="bold">WD_COUNT (Current Counter Value)</text>
    <text x="90" y="45" fill="#a5b4fc" font-size="11">Bits [7:0]: Live readback of internal down counter</text>
  </g>

  <!-- Interconnect arrows -->
  <!-- Write arrow from CPU OUT to Registers -->
  <path d="M 270 395 L 320 395 L 320 300 L 370 300" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#writeArr)"/>
  <rect x="285" y="335" width="60" height="20" rx="3" fill="#78350f"/>
  <text x="315" y="349" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">WRITE</text>

  <!-- Read arrow from Registers to CPU IN -->
  <path d="M 370 240 L 320 240 L 320 215 L 270 215" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#readArr)"/>
  <rect x="285" y="190" width="60" height="20" rx="3" fill="#0369a1"/>
  <text x="315" y="204" fill="#e0f2fe" font-size="10" font-weight="bold" text-anchor="middle">READ</text>
</svg>
